<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Golden-ratio emblem: 50 → 30.9 → 19.1 → 11.8 (each × 0.618) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#145550"/>
      <stop offset="1" stop-color="#0a2c2a"/>
    </linearGradient>
    <mask id="m">
      <rect width="100" height="100" fill="white"/>
      <circle cx="57.3" cy="47.2" r="10.08" fill="black"/>
    </mask>
  </defs>
  <rect width="100" height="100" rx="23.6" fill="url(#g)"/>
  <g fill="none" stroke="#e3c878" stroke-width="4.2" stroke-linejoin="round">
    <rect x="28.15" y="28.15" width="43.7" height="43.7"/>
    <rect x="28.15" y="28.15" width="43.7" height="43.7" transform="rotate(45 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="11.8" fill="#e3c878" mask="url(#m)"/>
</svg>